name: Refresh demo data

# The live site is a demo. Its dashboards show the last 6 months / 30 days / this month,
# so the sample OT records are re-dated relative to today once a month.
on:
  schedule:
    - cron: '0 16 1 * *' # 00:00 Asia/Manila on the 1st of each month
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run demo:refresh
        env:
          ALLOW_DEMO_REFRESH: 'true'
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: 5432
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_SSL: 'true'
