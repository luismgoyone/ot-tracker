services:
  postgres:
    image: postgres:15-alpine
    container_name: ot-tracker-db
    environment:
      POSTGRES_DB: ot_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ot_tracker"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Applies migrations on startup. Load sample data with:
  #   docker compose exec backend npm run seed
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ot-tracker-backend
    ports:
      - "3001:3000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ot_tracker
      DATABASE_USER: postgres
      DATABASE_PASSWORD: password
      JWT_SECRET: local-development-secret-change-me-in-production
      NODE_ENV: development
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  # Serves the built app and proxies /api to the backend (see frontend/nginx.conf).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ot-tracker-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
